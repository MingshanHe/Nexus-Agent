appId: com.mingshanhe.nexus-agent
productName: Nexus Agent
copyright: Copyright © 2026 MingshanHe

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

# Claude Agent SDK 自带的 Claude Code 可执行文件要作为子进程启动，不能留在 asar 里
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**

extraResources:
  # 默认的 Agent 配置、提示词和项目模板
  - from: resources/defaults
    to: defaults
  # 内置的 EasyEDA API Skill（https://github.com/easyeda/easyeda-api-skill，MIT），
  # 连同它的桥接脚本依赖的 ws 一起放在 asar 之外：桥接脚本要作为独立进程运行，技能要整个复制进项目
  - from: vendor/easyeda-api-skill
    to: skills/easyeda-api
  - from: node_modules/ws
    to: skills/easyeda-api/node_modules/ws
    filter:
      - '**/*'
      - '!**/*.md'

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Nexus-Agent-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nexus Agent
  uninstallDisplayName: Nexus Agent

# 发布由 GitHub Actions 里的 gh release 完成，electron-builder 自己不上传
publish: null
