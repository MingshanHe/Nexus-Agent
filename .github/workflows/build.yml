name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build installer
        run: npm run dist

      # 打包后的自检：窗口能加载、预加载脚本生效、数据库可用、能找到 Claude Code 可执行文件
      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'release/win-unpacked/Nexus Agent.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Smoke test failed with exit code $($process.ExitCode)" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Agent-Setup
          path: release/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem release/*.exe | Select-Object -First 1).FullName
          gh release create $env:GITHUB_REF_NAME $installer --title "Nexus Agent $env:GITHUB_REF_NAME" --generate-notes
